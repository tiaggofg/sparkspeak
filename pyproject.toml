[project]
name = "sparkspeak"
version = "0.2.0"
description = "Local-first English tutor MCP harness with FSRS spaced repetition and lightweight WAV audio capture"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "fsrs>=4.0.0",
    "kokoro-onnx>=0.4.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]

[project.scripts]
sparkspeak-mcp = "sparkspeak.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkspeak"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["sparkspeak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
